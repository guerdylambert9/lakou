<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lakou Botanica Marketplace</title>
    <meta name="description" content="Prototype of Lakou, a marketplace for Haitian botanicas. Sample shops and data." />

    <meta name="robots" content="noindex, nofollow" />
    <!-- "Add to Home Screen" opens Lakou full-screen with its own icon. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Lakou" />
    <meta name="theme-color" content="#1b2163" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#11153f" media="(prefers-color-scheme: dark)" />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=Shrikhand&display=swap"
